<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECharts 地图与散点图</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      #map-container {
        width: 100%;
        height: 100vh;
      }
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #666;
      }
      .controls {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
        z-index: 1000;
      }
      button {
        padding: 5px 10px;
        margin: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="map-container"></div>
    <div id="loading" class="loading">加载地图数据中...</div>

    <div class="controls">
      <button id="refresh-data">刷新散点</button>
      <button id="zoom-in">放大</button>
      <button id="zoom-out">缩小</button>
    </div>

    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <script>
      // 等待 DOM 加载完成
      document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('map-container');
        const loadingEl = document.getElementById('loading');
        let chart = null;
        let currentZoom = 1.2;

        // 按钮事件
        document
          .getElementById('refresh-data')
          .addEventListener('click', function () {
            if (chart) {
              updateScatterData();
            }
          });

        document
          .getElementById('zoom-in')
          .addEventListener('click', function () {
            if (chart) {
              currentZoom += 0.5;
              chart.setOption({
                geo: { zoom: currentZoom },
              });
            }
          });

        document
          .getElementById('zoom-out')
          .addEventListener('click', function () {
            if (chart) {
              currentZoom = Math.max(0.5, currentZoom - 0.5);
              chart.setOption({
                geo: { zoom: currentZoom },
              });
            }
          });

        // 确保 ECharts 已加载
        if (typeof echarts === 'undefined') {
          loadingEl.textContent = 'ECharts 加载失败';
          return;
        }

        // 第一步：加载中国地图数据
        fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
          .then((response) => {
            if (!response.ok) {
              throw new Error('网络响应错误');
            }
            return response.json();
          })
          .then((chinaGeoJson) => {
            // 第二步：注册地图数据
            echarts.registerMap('china', chinaGeoJson);
            loadingEl.style.display = 'none';

            // 第三步：初始化图表
            initChart();
          })
          .catch((error) => {
            console.error('加载地图数据失败:', error);
            loadingEl.textContent = '加载地图数据失败: ' + error.message;
          });

        // 生成随机散点数据
        function generateScatterData() {
          const data = [];
          const categories = [
            { name: '高价值', color: '#FF5733' },
            { name: '中等价值', color: '#33A6FF' },
            { name: '低价值', color: '#33FF57' },
          ];

          // 生成50个随机点
          for (let i = 0; i < 50; i++) {
            // 中国大陆大致范围
            const lng = 73 + Math.random() * (135 - 73);
            const lat = 18 + Math.random() * (53 - 18);
            const value = Math.floor(Math.random() * 100);

            // 根据值确定类别
            const categoryIndex = value > 70 ? 0 : value > 30 ? 1 : 2;

            data.push({
              name: `点 ${i + 1}`,
              value: [lng, lat, value],
              category: categories[categoryIndex].name,
              itemStyle: {
                color: categories[categoryIndex].color,
              },
            });
          }

          return { data, categories };
        }

        // 更新散点数据
        function updateScatterData() {
          const { data } = generateScatterData();
          chart.setOption({
            series: [
              {
                name: '散点数据',
                data: data,
              },
            ],
          });
        }

        // 初始化图表
        function initChart() {
          chart = echarts.init(container);

          // 生成初始散点数据
          const { data, categories } = generateScatterData();

          // 图表配置
          const option = {
            backgroundColor: '#404a59',
            title: {
              text: '中国地图散点图示例',
              subtext: '随机生成的50个数据点',
              left: 'center',
              textStyle: {
                color: '#fff',
              },
              subtextStyle: {
                color: '#ccc',
              },
            },
            tooltip: {
              trigger: 'item',
              formatter: function (params) {
                if (params.seriesType === 'scatter') {
                  return `${params.name}<br/>
                                        类别: ${params.data.category}<br/>
                                        经度: ${params.value[0].toFixed(2)}<br/>
                                        纬度: ${params.value[1].toFixed(2)}<br/>
                                        数值: ${params.value[2]}`;
                } else {
                  return params.name;
                }
              },
            },
            legend: {
              orient: 'vertical',
              top: 'bottom',
              left: 'right',
              data: categories.map((item) => item.name),
              textStyle: {
                color: '#fff',
              },
              selectedMode: 'multiple',
            },
            visualMap: {
              min: 0,
              max: 100,
              calculable: true,
              inRange: {
                symbolSize: [5, 20],
              },
              textStyle: {
                color: '#fff',
              },
              left: 'left',
            },
            geo: {
              map: 'china',
              roam: true,
              zoom: currentZoom,
              center: [104.5, 36],
              label: {
                emphasis: {
                  show: false,
                },
              },
              itemStyle: {
                normal: {
                  areaColor: '#323c48',
                  borderColor: '#111',
                },
                emphasis: {
                  areaColor: '#2a333d',
                },
              },
            },
            series: [
              {
                name: '散点数据',
                type: 'scatter',
                coordinateSystem: 'geo',
                data: data,
                symbolSize: function (val) {
                  return Math.sqrt(val[2]) * 1.5 + 3;
                },
                emphasis: {
                  label: {
                    show: true,
                    formatter: '{b}',
                    position: 'right',
                    color: '#fff',
                  },
                  itemStyle: {
                    shadowBlur: 10,
                    shadowColor: 'rgba(255, 255, 255, 0.5)',
                  },
                },
                zlevel: 1,
              },
            ],
          };

          // 设置选项并渲染
          chart.setOption(option);

          // 添加点击事件
          chart.on('click', function (params) {
            console.log('点击事件:', params);
            if (params.componentType === 'series') {
              alert(
                `点击了: ${params.name}\n类别: ${params.data.category}\n数值: ${params.value[2]}`
              );
            } else if (params.componentType === 'geo') {
              alert(`点击了地区: ${params.name}`);
            }
          });

          // 响应窗口大小变化
          window.addEventListener('resize', function () {
            chart.resize();
          });
        }
      });
    </script>
  </body>
</html>
